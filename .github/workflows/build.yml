name: Build & Test Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run Domain tests
      run: dotnet test tests/Certus.Domain.Tests/ --configuration Release --no-build --verbosity minimal

    - name: Run Application tests
      run: dotnet test tests/Certus.Application.Tests/ --configuration Release --no-build --verbosity minimal

    - name: Run Infrastructure tests
      run: dotnet test tests/Certus.Infrastructure.Tests/ --configuration Release --no-build --verbosity minimal

    - name: Run Integration tests
      run: dotnet test tests/Certus.IntegrationTests/ --configuration Release --no-build --verbosity minimal

    - name: Run Architecture tests
      run: dotnet test tests/Certus.ArchitectureTests/ --configuration Release --no-build --verbosity minimal

    - name: Publish Dashboard
      run: dotnet publish src/Certus.Dashboard/Certus.Dashboard.csproj -c Release -o ./publish --no-build
